<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras | Avocare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .cart-wrapper {
            max-width: 1200px;
            margin: 2rem auto 5rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 2rem;
            align-items: start;
            position: relative;
            z-index: 2;
        }
        @media (max-width: 850px) {
            .cart-wrapper { grid-template-columns: 1fr; }
        }
        .cart-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }
        .cart-table th {
            background: var(--primary-dark, #2C3E2D);
            color: #ffffff;
            padding: 1rem 1.2rem;
            text-align: left;
            font-size: 0.95rem;
        }
        .cart-table td {
            padding: 1.2rem;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
            font-size: 0.95rem;
        }
        .qty-btn {
            background: #f4f4f4;
            border: 1px solid #ddd;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .qty-btn:hover { background: #e8e8e8; }
        .remove-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.7;
        }
        .remove-btn:hover { opacity: 1; }
        
        .summary-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
            color: #444;
        }
        .summary-row.total {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-dark, #2C3E2D);
            border-top: 2px solid #f0f0f0;
            padding-top: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Header Navegable Unificado -->
    <header>
        <div class="logo">
            <a href="index.html" class="logo-link">
                AV<svg class="logo-avocado" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50,10 C30,10 20,35 20,60 C20,80 33,90 50,90 C67,90 80,80 80,60 C80,35 70,10 50,10 Z" fill="currentColor"/>
                    <path d="M50,20 C36,20 28,40 28,60 C28,75 37,82 50,82 C63,82 72,75 72,60 C72,40 64,20 50,20 Z" fill="#FAF8F5"/>
                    <circle cx="50" cy="62" r="14" fill="#C5A059"/>
                </svg>CARE
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#nosotros">Sobre Nosotros</a></li>
                <li><a href="index.html#productos">Productos</a></li>
                <li><a href="index.html#beneficios">Beneficios</a></li>
                <li><a href="index.html#uso">Modo de Uso</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="icon-link">👤 Cuenta</a>
            <a href="carrito.html" class="icon-link">🛒 Carrito (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <main>
        <h2 class="section-title" style="margin-top: 2rem;">Tu Carrito de Compras</h2>
        
        <div class="cart-wrapper">
            <!-- Tabla de Ítems -->
            <div class="cart-card">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio U.</th>
                            <th style="text-align: center;">Cantidad</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Generado por main.js -->
                    </tbody>
                </table>
            </div>

            <!-- Resumen Financiero -->
            <div class="summary-card">
                <h3 style="font-family: var(--font-heading); color: var(--primary-dark); margin-bottom: 1.5rem; font-size: 1.6rem;">Resumen de Compra</h3>
                
                <div class="summary-row">
                    <span>Subtotal (Neto):</span>
                    <strong id="cart-subtotal">$0</strong>
                </div>
                
                <div class="summary-row">
                    <span>IVA (19% incluido):</span>
                    <strong id="cart-tax">$0</strong>
                </div>
                
                <div class="summary-row total">
                    <span>Total a Pagar:</span>
                    <strong id="cart-total">$0</strong>
                </div>

                <button class="btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 0.9rem; font-size: 1rem;" onclick="alert('¡Gracias por apoyar la propuesta de economía circular de Avocare!')">Proceder al Pago</button>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
