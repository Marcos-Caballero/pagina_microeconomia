<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Avocare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 550px;
            margin: 3rem auto 5rem auto;
            padding: 2.5rem;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            position: relative;
            z-index: 2;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 2rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-family: var(--font-heading, 'Cormorant Garamond', serif);
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: var(--primary-dark, #2C3E2D);
            border-bottom-color: var(--primary-dark, #2C3E2D);
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; }
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #444;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-dark, #2C3E2D);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 1.5rem;
        }
        .checkbox-group input {
            width: auto;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Header Navegable Unificado -->
    <header>
        <div class="logo">
            <a href="index.html" class="logo-link">
                AV<svg class="logo-avocado" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50,10 C30,10 20,35 20,60 C20,80 33,90 50,90 C67,90 80,80 80,60 C80,35 70,10 50,10 Z" fill="currentColor"/>
                    <path d="M50,20 C36,20 28,40 28,60 C28,75 37,82 50,82 C63,82 72,75 72,60 C72,40 64,20 50,20 Z" fill="#FAF8F5"/>
                    <circle cx="50" cy="62" r="14" fill="#C5A059"/>
                </svg>CARE
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#inicio">Inicio</a></li>
                <li><a href="index.html#nosotros">Sobre Nosotros</a></li>
                <li><a href="index.html#productos">Productos</a></li>
                <li><a href="index.html#beneficios">Beneficios</a></li>
                <li><a href="index.html#uso">Modo de Uso</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <a href="login.html" class="icon-link">👤 Cuenta</a>
            <a href="carrito.html" class="icon-link">🛒 Carrito (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <!-- Selector de Pestañas -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchAuthTab('login')">Iniciar Sesión</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">Registrarse</button>
            </div>

            <!-- Formulario de Iniciar Sesión -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">Ingresar</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-name">Nombre</label>
                        <input type="text" id="reg-name" placeholder="Juan" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-lastname">Apellido</label>
                        <input type="text" id="reg-lastname" placeholder="Pérez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Crea una contraseña segura" required minlength="6">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-dob">Fecha de Nacimiento</label>
                        <input type="date" id="reg-dob" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-phone">Teléfono / WhatsApp</label>
                        <input type="tel" id="reg-phone" placeholder="300 123 4567" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-address">Dirección de Envío</label>
                    <input type="text" id="reg-address" placeholder="Calle 123 # 45 - 67, Apto 101" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="reg-terms" required>
                    <label for="reg-terms">Acepto los <a href="#" style="color: var(--primary-dark, #2C3E2D);">Términos y Condiciones</a> y la Política de Privacidad.</label>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">Crear Cuenta</button>
            </form>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
