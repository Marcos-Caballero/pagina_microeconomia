<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta | Avocare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
    <header>
        <div class="logo">
    <a href="index.html" class="logo-link">
        AV<svg class="logo-avocado" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Silueta exterior del aguacate -->
            <path d="M50,10 C30,10 20,35 20,60 C20,80 33,90 50,90 C67,90 80,80 80,60 C80,35 70,10 50,10 Z" fill="currentColor"/>
            <!-- Pulpa interior -->
            <path d="M50,20 C36,20 28,40 28,60 C28,75 37,82 50,82 C63,82 72,75 72,60 C72,40 64,20 50,20 Z" fill="#FAF8F5"/>
            <!-- Semilla (Pepa) -->
            <circle cx="50" cy="62" r="14" fill="#C5A059"/>
        </svg>CARE
    </a>
</div>
        <div class="user-actions"><a href="index.html" class="icon-link">Volver a Inicio</a></div>
    </header>

    <main class="section-padding" style="display: flex; justify-content: center;">
        <div class="auth-card">
            <h2 class="section-title">Ingresar</h2>
            <form onsubmit="simularLogin(event)">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">¿No tienes cuenta? <a href="#" style="color: var(--accent-gold);">Regístrate aquí</a></p>
        </div>
    </main>

    <script src="main.js"></script>
    <script>
        function simularLogin(e) {
            e.preventDefault();
            alert("¡Sesión iniciada con éxito! (Simulación)");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
